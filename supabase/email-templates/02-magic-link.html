<!-- Momentum - gabarit commun. Voir supabase/email-templates/README.md -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fbfbf7;margin:0;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #eeeae0;border-radius:14px;overflow:hidden">

      <tr><td align="center" style="background:#3a6a86;padding:30px 24px">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td
          align="center" valign="middle"
          style="width:60px;height:60px;background:#ffffff;border-radius:15px;font-size:30px;line-height:1;color:#3a6a86;font-weight:700">&#8222;&#8221;</td>
        </tr></table>
      </td></tr>

      <tr><td style="padding:34px 34px 0">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td align="center" style="font-size:21px;font-weight:700;color:#1a1815;line-height:1.3;padding-bottom:10px">Ton lien de connexion</td></tr>
          <tr><td align="center" style="font-size:15px;line-height:1.6;color:#797569;padding-bottom:26px">Clique pour te connecter &agrave; Momentum. Aucun mot de passe &agrave; saisir.</td></tr>
          <tr><td align="center" style="padding:4px 0 28px">
            <a href="{{ .ConfirmationURL }}" style="background:#1a1815;color:#ffffff;text-decoration:none;padding:13px 30px;border-radius:8px;font-weight:600;font-size:15px;display:inline-block">Me connecter</a>
          </td></tr>
          <tr><td align="center" style="padding-bottom:6px;font-size:12px;color:#797569;text-transform:uppercase;letter-spacing:.08em">Ou saisis ce code</td></tr>
          <tr><td align="center" style="padding-bottom:26px">
            <span style="display:inline-block;background:#f7f4ec;border:1px solid #eeeae0;border-radius:9px;padding:12px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;letter-spacing:.22em;font-weight:700;color:#1a1815">{{ .Token }}</span>
          </td></tr>
          <tr><td style="background:#f7f4ec;border:1px solid #eeeae0;border-radius:9px;padding:14px 16px;font-size:13px;line-height:1.6;color:#3d3a33">Le lien et le code expirent au bout d'une heure, et ne servent qu'une fois.</td></tr>
          <tr><td style="height:24px"></td></tr>
        </table>
      </td></tr>

      <tr><td style="padding:0 34px 30px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="border-top:1px solid #eeeae0;padding-top:16px;font-size:12px;line-height:1.6;color:#797569">Tu n'es pas &agrave; l'origine de cette demande&nbsp;? Ignore cet e-mail, rien ne sera modifi&eacute;.</td></tr>
        </table>
      </td></tr>

    </table>
  </td></tr>
</table>
