<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Momentum</title>
</head>
<body style="margin:0; padding:0; background-color:#fbfbf7; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fbfbf7; padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:20px; overflow:hidden; border:1px solid #eeeae0;">

          <!-- Bandeau accent -->
          <tr>
            <td style="background-color:#3a6a86; padding:36px 40px; text-align:center;">
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td width="72" height="72" align="center" valign="middle" style="width:72px; height:72px; border-radius:18px; background-color:#ffffff;">
                    <img src="{{ .SiteURL }}/logo-momentum.png" width="48" height="48" alt="Momentum" style="display:block; width:48px; height:48px;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Titre -->
          <tr>
            <td style="padding:32px 40px 8px; text-align:center;">
              <h1 style="margin:0; font-size:22px; font-weight:700; color:#1a1815; letter-spacing:-0.2px;">Tu es invit&eacute;(e) sur Momentum</h1>
            </td>
          </tr>

          <!-- Corps -->
          <tr>
            <td style="padding:8px 40px 32px; text-align:center;">
              <p style="margin:0; font-size:14px; line-height:1.6; color:#797569;">
                Ton coach t'a cr&eacute;&eacute; un acc&egrave;s &agrave; la plateforme.<br>
                Choisis ton mot de passe pour d&eacute;couvrir ton espace personnel.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td style="padding:0 40px 40px; text-align:center;">
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td style="border-radius:12px; background-color:#3a6a86;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block; padding:14px 34px; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:12px; letter-spacing:0.1px;">
                      Acc&eacute;der &agrave; mon espace &rarr;
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0; font-size:12px; line-height:1.5; color:#a3a39e;">
                Ce lien est valable 24 heures.<br>
                Si tu n'es pas &agrave; l'origine de cette demande, ignore cet email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px; border-top:1px solid #eeeae0; text-align:center;">
              <span style="font-size:11px; color:#a3a39e; letter-spacing:0.2px;">MOMENTUM COACHING</span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
